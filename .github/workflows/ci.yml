name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The product is macOS-only (Keychain via /usr/bin/security, BSD ps in tests), so a Linux runner fails its tests.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:panel
      # test/e2e/p2.test.ts drives a local Chrome and the OmO.app runtime at fixed macOS paths, so it is not run here.
      - run: bun test test/*.test.ts test/e2e/p1.test.ts
